<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background-color: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            width: 320px;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        input[type="submit"] {
            width: 100%;
            background-color: #4facfe;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        input[type="submit"]:hover {
            background-color: #00c6ff;
        }
        .signup-link {
            text-align: center;
            margin-top: 15px;
        }
        .signup-link a {
            color: #4facfe;
            text-decoration: none;
            font-weight: bold;
        }
        .signup-link a:hover {
            text-decoration: underline;
        }
        /* ✅ Added new section for navigation link */
        .home-link {
            text-align: center;
            margin-top: 10px;
        }
        .home-link a {
            color: #00a2ff;
            text-decoration: none;
            font-weight: bold;
        }
        .home-link a:hover {
            text-decoration: underline;
        }
        /* ✅ Added forgot password link style */
        .forgot-password {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 15px;
        }
        .forgot-password a {
            color: #ff4b5c;
            text-decoration: none;
            font-size: 14px;
        }
        .forgot-password a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <form action="Login" method="post" class="login-container">
        <h2>Login</h2>
        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br>

        <label for="password">Password</label><br>
        <input type="password" id="password" name="password" placeholder="Enter your password" required><br>

        <!-- ✅ Added forgot password link here -->
        <div class="forgot-password">
            <a href="forgotpassword.html">Forgot Password?</a>
        </div>

        <input type="submit" value="Login">

        <div class="signup-link">
            <p>Don't have an account? <a href="reg.html">Register</a></p>
        </div>

        <!-- ✅ Existing home link retained -->
        <div class="home-link">
            <a href="reg.html">← Back to Registration Page</a>
        </div>
    </form>
</body>
</html>
